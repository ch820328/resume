<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepan Tsai | Engineering Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;700&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/assets/styles.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-dark: #1e293b;
            --accent: #3b82f6;
            --accent-success: #10b981;
            --text-gray: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        header { padding: 1.2rem 2rem; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-family: 'Outfit', sans-serif; font-size: 1.5rem; background: linear-gradient(to right, #6366f1, #10b981); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

        .main-container { display: flex; flex: 1; overflow: hidden; }

        /* LEFT PANEL: RESUME HUB */
        .resume-panel {
            width: 380px;
            background: var(--panel-dark);
            border-right: 1px solid rgba(255,255,255,0.05);
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .section-title { font-size: 0.75rem; font-weight: 700; color: var(--text-gray); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 1rem; display: block; }
        
        .resume-topic {
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            padding: 1.2rem;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
        }
        .resume-topic:hover { border-color: rgba(59, 130, 246, 0.3); background: rgba(255,255,255,0.04); }
        
        .topic-header { font-size: 1.05rem; font-weight: 700; margin-bottom: 1.1rem; color: #f1f5f9; font-family: 'Outfit', sans-serif; }
        
        .action-matrix { display: flex; flex-direction: column; gap: 1rem; }
        .action-row { display: flex; flex-direction: column; gap: 0.4rem; }
        .action-label { font-size: 0.65rem; color: var(--text-gray); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

        .btn-small {
            padding: 0.5rem;
            font-size: 0.75rem;
            text-align: center;
            background: rgba(255,255,255,0.05);
            color: #e2e8f0;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            font-weight: 600;
        }
        .btn-small:hover { background: var(--accent); border-color: var(--accent); color: white; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2); }

        .master-topic {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(16, 185, 129, 0.08));
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        /* RIGHT PANEL: SLIDES EXPLORER */
        .slide-panel { flex: 1; padding: 2rem; overflow-y: auto; background: var(--bg-dark); }
        .slide-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.2rem; }
        
        .slide-thumb {
            aspect-ratio: 16/10;
            background: #1e293b;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            padding: 1rem;
            justify-content: center;
            position: relative;
        }
        .slide-thumb:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 10px 25px -10px rgba(59, 130, 246, 0.3); background: #26334d; }
        .slide-thumb .name { font-size: 0.85rem; font-weight: 700; color: #f1f5f9; line-height: 1.3; }
        
        /* MODAL */
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.9); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        #modal-container { width: 95%; height: 92%; background: #fff; border-radius: 16px; position: relative; overflow: hidden !important; display: flex; flex-direction: column; box-shadow: 0 50px 100px -20px rgba(0, 0, 0, 0.6); border: 1px solid rgba(255,255,255,0.1); }
        #modal-content { flex: 1; position: relative; padding: 0; overflow: hidden !important; display: flex; align-items: center; justify-content: center; }
        .modal-slide-view { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        .modal-slide-view .slide {
            opacity: 1 !important; transform: none !important; position: relative !important; top: 0 !important; left: 0 !important;
            height: 100% !important; width: 100% !important; padding: 2rem 4rem !important; 
            background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.05) 0%, #ffffff 40%),
                        radial-gradient(circle at bottom left, rgba(79, 70, 229, 0.05) 0%, #ffffff 40%) !important;
            display: flex !important; flex-direction: column !important; justify-content: flex-start !important; overflow: hidden !important;
            color: #1e293b !important;
        }
        .modal-slide-view .slide h1, .modal-slide-view .slide h2, .modal-slide-view .slide p, .modal-slide-view .slide .star-text { color: #1e293b !important; }
        .modal-slide-view .slide-header-row { 
            margin-bottom: 1.5rem !important; 
            padding-bottom: 0.75rem !important;
            flex-shrink: 0 !important;
        }
        .modal-slide-view .slide-title { font-size: 2rem !important; line-height: 1.2 !important; }
        
        .modal-slide-view .content-wrapper { margin: 0 auto !important; width: 100% !important; max-width: 1200px !important; padding: 0 !important; height: 100% !important; display: flex !important; flex-direction: column !important; }
        
        /* Fixed Split Layout for Modal */
        .modal-slide-view .star-grid { 
            flex: 1 !important; 
            display: flex !important; 
            flex-direction: row !important; 
            gap: 3rem !important; 
            min-height: 0 !important; 
            align-items: center !important;
            padding-bottom: 2rem !important;
        }
        .modal-slide-view .star-content { 
            display: flex !important; 
            flex-direction: column !important; 
            gap: 1rem !important; 
            width: 38% !important;
            justify-content: center !important;
        }
        .modal-slide-view .star-card {
            background: rgba(255, 255, 255, 0.8) !important;
            border-radius: 12px !important;
            padding: 1.25rem !important;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05) !important;
            border: 1px solid rgba(0,0,0,0.05) !important;
        }
        .modal-slide-view .star-visual { 
            flex: 1 !important; 
            display: flex !important; 
            align-items: center !important; 
            justify-content: center !important;
            min-height: 0 !important;
        }
        .modal-slide-view .process-flow-viz {
            width: 100% !important;
            height: 100% !important;
            max-height: 600px !important;
            background: transparent !important;
            border-radius: 16px !important;
            padding: 0 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            position: relative !important;
        }
        /* Removed Mac Window Buttons Simulation from CSS as it's now in the SVGs */
        
        .modal-slide-view .process-flow-viz img {
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain !important;
        }
    </style>
</head>
<body>
    <header>
        <h1>Engineering Productivity Console</h1>
        <div style="font-size: 0.8rem; color: var(--text-gray);">v2.0 • Matrix Navigation Hub</div>
    </header>

    <div class="main-container">
        <!-- LEFT: RESUME HUB -->
        <div class="resume-panel" id="dynamic-profiles-container">
            <div style="color: var(--text-gray); font-size: 0.8rem;">Loading profiles...</div>
        </div>

        <!-- RIGHT: SLIDES EXPLORER -->
        <div class="slide-panel">
            <span class="section-title">Case Study Slides Explorer</span>
            <div class="slide-grid" id="slide-grid">
                <!-- Slides will be injected here via scripts -->
            </div>
        </div>
    </div>

    <!-- MODAL OVERLAY -->
    <div id="modal-overlay">
        <div id="modal-container">
            <div id="modal-content" class="slides-container">
                <!-- Fetched slide content goes here -->
            </div>
        </div>
    </div>

    <script>
        const slides = [
            { id: 'openclaw_mr', name: 'OpenClaw: MR Automation', tag: 'AI / GitLab' },
            { id: 'openclaw_log', name: 'OpenClaw: Log Matrix', tag: 'AI / Diagnostic' },
            { id: 'jetson_bsp', name: 'Embedded BSP Factory', tag: 'NVIDIA / Docker' },
            { id: 'secure_python_efi', name: 'Secure EFI Python', tag: 'Security / C' },
            { id: 'mysql_performance', name: 'MySQL Perf Cluster', tag: 'DB / Monitoring' },
            { id: 'ansible', name: 'Infrastructure as Code', tag: 'IaC / Ansible' },
            { id: 'central_dashboard', name: 'Unified Console', tag: 'Full-Stack / Go' },
            { id: 'nvssvt_portal', name: 'Automation Engine', tag: 'Go / Platform' },
            { id: 'gitlab_ci', name: 'Quality Gating', tag: 'QA / CI' },
            { id: 'gitlab_cd', name: 'GitOps Pipeline', tag: 'CD / Terraform' },
            { id: 'rftool_framework', name: 'RFTOOL Refactor', tag: 'Tooling / Patterns' },
            { id: 'baby_tracker', name: 'Local-First App', tag: 'Sync / React' },
            { id: 'pic_transcript', name: 'OCR Document Engine', tag: 'CV / Python' }
        ];

        const grid = document.getElementById('slide-grid');
        const modal = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');

        // Render Slide Grid
        slides.forEach(slide => {
            const div = document.createElement('div');
            div.className = 'slide-thumb';
            
            div.innerHTML = `
                <div class="name">${slide.name}</div>
                <div class="tag-label" style="font-size: 0.6rem; color: var(--accent); font-weight: 700; margin-top: 8px; text-transform: uppercase; letter-spacing: 0.05em;">${slide.tag}</div>
                <div style="font-size: 0.5rem; color: #475569; margin-top: 4px; opacity: 0.7;">${slide.id}.html</div>
            `;
            
            div.onclick = () => openSlide(slide.id);
            grid.appendChild(div);
        });

        // Load Profiles Dynamically
        async function loadProfiles() {
            try {
                const response = await fetch('config/onepage_config.json');
                const config = await response.json();
                const container = document.getElementById('dynamic-profiles-container');
                
                let masterHtml = '';
                let specsHtml = '';

                for (const [key, profile] of Object.entries(config.profiles)) {
                    const onePagePdf = profile.output_file ? profile.output_file.replace('.html', '.pdf') : `resume_${key}.pdf`;
                    const slidesPdf = key === 'master' ? 'resume_slides.pdf' : `resume_slides_${key}.pdf`;
                    
                    // Generate a shorter display name for the UI by taking the part inside parentheses if it exists, or truncating
                    let displayName = profile.name;
                    const match = displayName.match(/\((.*?)\)/);
                    if (match) {
                        displayName = match[1];
                    } else if (displayName.length > 25) {
                        displayName = displayName.substring(0, 25) + '...';
                    }

                    const template = `
                        <div class="resume-topic ${key === 'master' ? 'master-topic' : ''}" style="margin-bottom: 0.8rem;">
                            <div class="topic-header" style="font-size: 0.95rem; line-height: 1.2;">${displayName}</div>
                            <div class="btn-group">
                                <a href="output/${onePagePdf}" target="_blank" class="btn-small">One-page</a>
                                <a href="output/${slidesPdf}" target="_blank" class="btn-small">Slides</a>
                            </div>
                        </div>
                    `;

                    if (key === 'master') {
                        masterHtml += template;
                    } else {
                        specsHtml += template;
                    }
                }

                container.innerHTML = `
                    <div class="resume-section">
                        <span class="section-title">Master Portfolio</span>
                        ${masterHtml}
                    </div>
                    <div class="resume-section">
                        <span class="section-title">Tailored Profiles (JDs)</span>
                        ${specsHtml}
                    </div>
                `;
            } catch(e) {
                console.error("Error loading profiles", e);
                document.getElementById('dynamic-profiles-container').innerHTML = '<div style="color:red;">Failed to load profiles.</div>';
            }
        }
        
        loadProfiles();

        async function openSlide(slideId) {
            modalContent.innerHTML = '<div style="display:flex; justify-content:center; align-items:center; height:100%; color: #334155;">Loading Professional Slide...</div>';
            modal.style.display = 'flex';
            
            try {
                const response = await fetch(`src/slides/${slideId}.html`);
                const html = await response.text();
                
                // Wrap in required classes for styles.css to work correctly
                modalContent.innerHTML = `<div class="modal-slide-view">${html}</div>`;
            } catch (err) {
                modalContent.innerHTML = `<div style="color: red; padding: 2rem;">Error loading slide: ${err.message}</div>`;
            }
        }

        const closeModal = () => {
            modal.style.display = 'none';
        };

        // Close on background click
        window.onclick = (event) => {
            if (event.target == modal) closeModal();
        };

        // Close on ESC key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modal.style.display === 'flex') {
                closeModal();
            }
        });
    </script>
</body>
</html>
