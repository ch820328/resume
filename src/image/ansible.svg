<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,1);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0.6);stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1"/>
        </marker>
    </defs>

    <!-- Control Node -->
    <rect x="220" y="40" width="160" height="80" fill="url(#glassGrad)" stroke="#2563eb" stroke-width="1.5" rx="16" style="filter: drop-shadow(0 8px 24px rgba(37,99,235,0.1))"/>
    <text x="240" y="80" font-family="Inter, sans-serif" font-size="12" fill="#1e40af" font-weight="700">ANSIBLE CONTROL</text>
    <text x="240" y="98" font-family="Inter, sans-serif" font-size="9" fill="#2563eb">Infrastructure as Code</text>

    <!-- SSH Fan-out -->
    <path d="M 300 120 L 100 240" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,2"/>
    <path d="M 300 120 L 300 240" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,2"/>
    <path d="M 300 120 L 500 240" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,2"/>

    <!-- Load Generators (Managed Nodes) -->
    <rect x="40" y="250" width="100" height="60" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="50" y="280" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">Node 01</text>
    <text x="50" y="295" font-family="Inter, sans-serif" font-size="8" fill="#16a34a">✓ Standardized</text>

    <rect x="250" y="250" width="100" height="60" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="260" y="280" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">Node ...</text>
    <text x="260" y="295" font-family="Inter, sans-serif" font-size="8" fill="#16a34a">✓ Standardized</text>

    <rect x="460" y="250" width="100" height="60" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="470" y="280" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">Node 10</text>
    <text x="470" y="295" font-family="Inter, sans-serif" font-size="8" fill="#16a34a">✓ Standardized</text>

    <!-- Synchronized Result -->
    <rect x="220" y="340" width="160" height="30" fill="#f0fdf4" stroke="#86efac" stroke-width="1" rx="15"/>
    <text x="240" y="360" font-family="Inter, sans-serif" font-size="10" fill="#166534" font-weight="600">⚡ 100% Environment Parity</text>
</svg>
