<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,1);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0.6);stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1"/>
        </marker>
    </defs>

    <!-- Client Node -->
    <rect x="40" y="140" width="120" height="120" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="20"/>
    <text x="55" y="175" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">MOBILE CLIENT</text>
    
    <rect x="55" y="190" width="90" height="40" fill="rgba(0,0,0,0.02)" stroke="#e2e8f0" rx="8"/>
    <text x="65" y="215" font-family="Inter, sans-serif" font-size="9" fill="#1e293b">Local SQLite</text>
    <text x="55" y="250" font-family="Inter, sans-serif" font-size="8" fill="#16a34a">✓ Offline Ready</text>

    <!-- Sync Link -->
    <path d="M 160 200 L 220 200" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow)"/>
    <text x="165" y="190" font-family="Inter, sans-serif" font-size="8" fill="#3b82f6">Auth Sync</text>

    <!-- Cloud Engine -->
    <rect x="230" y="100" width="160" height="200" fill="rgba(255,255,255,0.4)" stroke="#f59e0b" stroke-width="1" rx="24" style="filter: drop-shadow(0 8px 24px rgba(245,158,11,0.08))"/>
    <text x="250" y="130" font-family="Inter, sans-serif" font-size="10" fill="#92400e" font-weight="700">CLOUD SYNC ENGINE</text>
    
    <rect x="245" y="160" width="130" height="30" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="6"/>
    <text x="255" y="180" font-family="Inter, sans-serif" font-size="9" fill="#1e293b">Real-time Pub/Sub</text>
    
    <rect x="245" y="200" width="130" height="30" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="6"/>
    <text x="255" y="220" font-family="Inter, sans-serif" font-size="9" fill="#1e293b">Conflict Resolution</text>

    <!-- Outward Sync -->
    <path d="M 390 180 L 450 140" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 390 220 L 450 260" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Other Clients -->
    <rect x="460" y="100" width="80" height="60" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="470" y="135" font-family="Inter, sans-serif" font-size="9" fill="#475569" font-weight="600">Client B</text>

    <rect x="460" y="240" width="80" height="60" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="470" y="275" font-family="Inter, sans-serif" font-size="9" fill="#475569" font-weight="600">Web Dashboard</text>

    <!-- Tag -->
    <text x="400" y="340" font-family="Inter, sans-serif" font-size="11" fill="#166534" font-weight="700">📱 Seamless Persistence</text>
</svg>
