<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,1);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0.6);stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1"/>
        </marker>
    </defs>

    <!-- Artifact -->
    <rect x="40" y="160" width="80" height="80" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="50" y="195" font-family="Inter, sans-serif" font-size="9" fill="#475569" font-weight="700">Docker</text>
    <text x="50" y="210" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8">Artifact</text>

    <!-- Pipeline -->
    <rect x="160" y="80" width="300" height="240" fill="rgba(255,255,255,0.4)" stroke="#10b981" stroke-width="1" rx="20"/>
    <text x="180" y="105" font-family="Inter, sans-serif" font-size="10" fill="#065f46" font-weight="600">CONTINUOUS DEPLOYMENT</text>

    <!-- Deployment Stages -->
    <rect x="180" y="140" width="110" height="45" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="190" y="167" font-family="Inter, sans-serif" font-size="9" fill="#334155" font-weight="600">Staging Sync</text>

    <rect x="180" y="200" width="110" height="45" fill="url(#glassGrad)" stroke="#10b981" stroke-width="1.5" rx="8"/>
    <text x="190" y="227" font-family="Inter, sans-serif" font-size="9" fill="#065f46" font-weight="700">Health Check</text>

    <rect x="180" y="260" width="110" height="45" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="190" y="287" font-family="Inter, sans-serif" font-size="9" fill="#334155" font-weight="600">Prod Rollout</text>

    <!-- Connectors -->
    <path d="M 120 200 L 160 200" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
    
    <!-- Environment Tags -->
    <rect x="340" y="140" width="90" height="160" fill="rgba(0,0,0,0.02)" stroke="#e2e8f0" rx="12"/>
    <text x="350" y="160" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8">ENV STATUS</text>
    <circle cx="360" cy="185" r="4" fill="#10b981"/> <text x="370" y="188" font-family="Inter, sans-serif" font-size="8" fill="#475569">Prod: v2.4</text>
    <circle cx="360" cy="215" r="4" fill="#3b82f6"/> <text x="370" y="218" font-family="Inter, sans-serif" font-size="8" fill="#475569">Stage: v2.5</text>

    <!-- Final Result -->
    <text x="300" y="360" font-family="Inter, sans-serif" font-size="11" fill="#166534" font-weight="700">🚀 Zero-Downtime Releases</text>
</svg>
