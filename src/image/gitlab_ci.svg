<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,1);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0.6);stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1"/>
        </marker>
    </defs>

    <!-- Source -->
    <circle cx="60" cy="200" r="30" fill="url(#glassGrad)" stroke="#fca5a5" stroke-width="1"/>
    <text x="45" y="205" font-family="Inter, sans-serif" font-size="10" fill="#991b1b" font-weight="700">PUSH</text>

    <!-- Pipeline Container -->
    <rect x="120" y="100" width="360" height="200" fill="rgba(255,255,255,0.4)" stroke="#e2e8f0" stroke-width="1" rx="20"/>
    <text x="140" y="125" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" font-weight="600">AUTOMATED QUALITY GATE</text>

    <!-- Stages -->
    <rect x="140" y="150" width="80" height="80" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="150" y="185" font-family="Inter, sans-serif" font-size="9" fill="#475569" font-weight="700">BUILD</text>
    <path d="M 150 200 L 210 200" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="260" y="150" width="80" height="80" fill="url(#glassGrad)" stroke="#2563eb" stroke-width="1.5" rx="10"/>
    <text x="270" y="185" font-family="Inter, sans-serif" font-size="9" fill="#1e40af" font-weight="700">TEST</text>
    <text x="270" y="205" font-family="Inter, sans-serif" font-size="8" fill="#2563eb">Linter/Unit</text>

    <rect x="380" y="150" width="80" height="80" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="390" y="185" font-family="Inter, sans-serif" font-size="9" fill="#475569" font-weight="700">SECURITY</text>

    <!-- Connectors -->
    <path d="M 90 200 L 120 200" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 220 190 L 260 190" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 340 190 L 380 190" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Output -->
    <path d="M 480 200 L 520 200" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="525" y="170" width="50" height="60" fill="#f0fdf4" stroke="#22c55e" stroke-width="1" rx="8"/>
    <text x="530" y="205" font-family="Inter, sans-serif" font-size="8" fill="#166534" font-weight="700">PASS</text>
</svg>
