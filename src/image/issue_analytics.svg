<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,1);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0.6);stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1"/>
        </marker>
    </defs>

    <!-- Data Sources -->
    <rect x="40" y="100" width="100" height="60" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="12"/>
    <text x="52" y="135" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">GitLab MRs</text>
    
    <rect x="40" y="180" width="100" height="60" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="12"/>
    <text x="52" y="215" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">Jira Issues</text>

    <!-- Flow -->
    <path d="M 140 130 L 200 170" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 140 210 L 200 190" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Analytics Core -->
    <rect x="210" y="120" width="180" height="120" fill="rgba(255,255,255,0.4)" stroke="#8b5cf6" stroke-width="1" rx="20" style="filter: drop-shadow(0 8px 24px rgba(139,92,246,0.08))"/>
    <text x="230" y="150" font-family="Inter, sans-serif" font-size="11" fill="#5b21b6" font-weight="700">ANALYTICS ENGINE</text>
    
    <rect x="225" y="175" width="150" height="40" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="240" y="200" font-family="Inter, sans-serif" font-size="9" fill="#334155" font-weight="600">Velocity & Quality Gates</text>

    <!-- Flow -->
    <path d="M 390 180 L 450 180" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Governance Dashboard -->
    <rect x="460" y="110" width="110" height="140" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="16"/>
    <text x="470" y="135" font-family="Inter, sans-serif" font-size="9" fill="#475569" font-weight="700">GOVERNANCE</text>
    
    <rect x="470" y="155" width="90" height="25" fill="rgba(139,92,246,0.1)" rx="4"/>
    <text x="475" y="172" font-family="Inter, sans-serif" font-size="8" fill="#5b21b6">Lead Time</text>
    
    <rect x="470" y="185" width="90" height="25" fill="rgba(139,92,246,0.1)" rx="4"/>
    <text x="475" y="202" font-family="Inter, sans-serif" font-size="8" fill="#5b21b6">Cycle Time</text>

    <!-- Result -->
    <text x="350" y="320" font-family="Inter, sans-serif" font-size="11" fill="#166534" font-weight="700">📊 Data-Driven Engineering</text>
</svg>
