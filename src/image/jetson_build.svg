<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,1);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0.6);stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1"/>
        </marker>
    </defs>

    <!-- Canvas -->
    <rect width="600" height="400" fill="none"/>

    <!-- Input Column -->
    <rect x="40" y="100" width="110" height="60" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="55" y="130" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">L4T Source</text>
    <text x="55" y="145" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">NVIDIA BSP</text>

    <rect x="40" y="180" width="110" height="60" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="55" y="210" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">SKU Specs</text>
    <text x="55" y="225" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">RAM / Carrier</text>

    <!-- Arrow Connectors -->
    <path d="M 150 130 L 200 160" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 150 210 L 200 180" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Main Factory App -->
    <rect x="210" y="80" width="180" height="240" fill="rgba(255,255,255,0.4)" stroke="#2563eb" stroke-width="1" rx="20" style="filter: drop-shadow(0 8px 24px rgba(37,99,235,0.08))"/>
    <text x="230" y="105" font-family="Inter, sans-serif" font-size="11" fill="#1e40af" font-weight="700">BSP FACTORY (Go)</text>

    <!-- Sub-Tasks -->
    <rect x="225" y="130" width="150" height="40" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="240" y="155" font-family="Inter, sans-serif" font-size="10" fill="#334155" font-weight="600">Auto-Patching</text>

    <rect x="225" y="180" width="150" height="40" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="240" y="205" font-family="Inter, sans-serif" font-size="10" fill="#334155" font-weight="600">Zstd Optimization</text>

    <rect x="225" y="230" width="150" height="40" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="240" y="255" font-family="Inter, sans-serif" font-size="10" fill="#334155" font-weight="600">Image Build</text>

    <!-- Output Arrow -->
    <path d="M 390 170 L 450 170" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Result Box -->
    <rect x="460" y="130" width="100" height="80" fill="#f0fdf4" stroke="#22c55e" stroke-width="1" rx="12"/>
    <text x="475" y="165" font-family="Inter, sans-serif" font-size="11" fill="#166534" font-weight="700">Ready MFI</text>
    <text x="475" y="185" font-family="Inter, sans-serif" font-size="9" fill="#166534">UPH +25%</text>
</svg>
