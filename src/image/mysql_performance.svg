<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,0.9);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0.5);stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10" fill="none" stroke="#94a3b8" stroke-width="1"/>
        </marker>
    </defs>

    <!-- Canvas -->
    <rect width="600" height="400" fill="none"/>

    <!-- Load Generator -->
    <rect x="40" y="160" width="110" height="80" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.06)" stroke-width="1" rx="14"/>
    <text x="55" y="195" font-family="Inter, sans-serif" font-size="11" fill="#475569" font-weight="700">Sysbench</text>
    <text x="55" y="212" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Stress Load</text>

    <!-- Arrow 1 -->
    <path d="M 150 200 L 210 200" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Database Core Box -->
    <rect x="220" y="80" width="180" height="240" fill="rgba(255,255,255,0.2)" stroke="#e2e8f0" stroke-width="1" rx="20"/>
    <text x="235" y="105" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" font-weight="600">MYSQL 8.X CORE</text>

    <!-- Internal Modules -->
    <rect x="235" y="130" width="150" height="45" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.04)" stroke-width="1" rx="10"/>
    <text x="250" y="157" font-family="Inter, sans-serif" font-size="10" fill="#1e293b" font-weight="600">Lock Manager</text>

    <rect x="235" y="190" width="150" height="45" fill="url(#glassGrad)" stroke="#2563eb" stroke-width="1" rx="10" style="filter: drop-shadow(0 4px 10px rgba(37,99,235,0.1))"/>
    <text x="250" y="217" font-family="Inter, sans-serif" font-size="10" fill="#1e40af" font-weight="700">Log Writer Opt</text>

    <rect x="235" y="250" width="150" height="45" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.04)" stroke-width="1" rx="10"/>
    <text x="250" y="277" font-family="Inter, sans-serif" font-size="10" fill="#1e293b" font-weight="600">Thread Scaler</text>

    <!-- Feedback Loop -->
    <path d="M 400 212 L 460 212 Q 500 212 500 280 L 500 320 L 310 320 L 310 330" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="440" y="200" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Monitoring Feedback</text>

    <!-- Optimized Output -->
    <path d="M 400 110 L 460 110" fill="none" stroke="#22c55e" stroke-width="1" marker-end="url(#arrow)"/>
    <text x="470" y="115" font-family="Inter, sans-serif" font-size="11" fill="#166534" font-weight="700">99.9% Stability</text>
</svg>
