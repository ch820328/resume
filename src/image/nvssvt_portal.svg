<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,1);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0.6);stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1"/>
        </marker>
    </defs>

    <!-- Source Streams -->
    <rect x="30" y="80" width="100" height="40" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="40" y="105" font-family="Inter, sans-serif" font-size="9" fill="#475569" font-weight="700">Factory A Stream</text>
    
    <rect x="30" y="140" width="100" height="40" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="40" y="165" font-family="Inter, sans-serif" font-size="9" fill="#475569" font-weight="700">Factory B Stream</text>

    <rect x="30" y="200" width="100" height="40" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="40" y="225" font-family="Inter, sans-serif" font-size="9" fill="#475569" font-weight="700">Test Logs</text>

    <!-- Gateway -->
    <path d="M 130 100 L 180 160" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 130 160 L 180 170" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 130 220 L 180 180" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="190" y="140" width="140" height="60" fill="url(#glassGrad)" stroke="#2563eb" stroke-width="1" rx="12" style="filter: drop-shadow(0 4px 12px rgba(37,99,235,0.1))"/>
    <text x="205" y="170" font-family="Inter, sans-serif" font-size="10" fill="#1e40af" font-weight="700">CENTRAL GATEWAY</text>
    <text x="205" y="185" font-family="Inter, sans-serif" font-size="8" fill="#2563eb">Auth & API Normalization</text>

    <!-- Flow -->
    <path d="M 330 170 L 380 170" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Dashboard -->
    <rect x="390" y="100" width="160" height="140" fill="rgba(255,255,255,0.4)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="16"/>
    <text x="405" y="125" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">UNIFIED PORTAL</text>
    
    <rect x="405" y="145" width="130" height="30" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="4"/>
    <text x="415" y="165" font-family="Inter, sans-serif" font-size="9" fill="#1e293b">Real-time Yield</text>
    
    <rect x="405" y="185" width="130" height="30" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="4"/>
    <text x="415" y="205" font-family="Inter, sans-serif" font-size="9" fill="#1e293b">Station Status</text>

    <!-- Impact Badge -->
    <text x="400" y="300" font-family="Inter, sans-serif" font-size="11" fill="#166534" font-weight="700">📈 Centralized Visibility</text>
</svg>
