<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,1);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0.6);stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1"/>
        </marker>
    </defs>

    <!-- Raw Logs -->
    <rect x="30" y="150" width="100" height="100" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="14"/>
    <text x="45" y="190" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">Raw Logs</text>
    <text x="45" y="210" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8">Unstructured</text>
    <path d="M 45 220 L 85 220" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 45 230 L 70 230" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Flow -->
    <path d="M 130 200 L 180 200" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Semantic Processing -->
    <rect x="190" y="80" width="180" height="240" fill="rgba(255,255,255,0.4)" stroke="#2563eb" stroke-width="1" rx="20" style="filter: drop-shadow(0 8px 24px rgba(37,99,235,0.08))"/>
    <text x="205" y="105" font-family="Inter, sans-serif" font-size="11" fill="#1e40af" font-weight="700">SEMANTIC PIPELINE</text>
    
    <rect x="205" y="130" width="150" height="40" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="220" y="155" font-family="Inter, sans-serif" font-size="9" fill="#334155" font-weight="600">Dynamic Chunking</text>
    
    <rect x="205" y="180" width="150" height="40" fill="url(#glassGrad)" stroke="#2563eb" stroke-width="1" rx="8"/>
    <text x="220" y="205" font-family="Inter, sans-serif" font-size="9" fill="#1e40af" font-weight="700">Vector Embedding</text>

    <rect x="205" y="230" width="150" height="40" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="220" y="255" font-family="Inter, sans-serif" font-size="9" fill="#334155" font-weight="600">Contextual Search</text>

    <!-- Flow -->
    <path d="M 370 200 L 420 200" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Root Cause -->
    <rect x="430" y="140" width="130" height="120" fill="url(#glassGrad)" stroke="#10b981" stroke-width="1" rx="14"/>
    <text x="445" y="180" font-family="Inter, sans-serif" font-size="10" fill="#065f46" font-weight="700">DIAGNOSTIC</text>
    <text x="445" y="200" font-family="Inter, sans-serif" font-size="9" fill="#059669">Root Cause Analysis</text>
    <circle cx="500" cy="230" r="12" fill="#dcfce7" stroke="#10b981"/>
    <text x="495" y="235" font-family="Inter, sans-serif" font-size="12" fill="#166534">✓</text>

    <!-- Tag -->
    <text x="350" y="340" font-family="Inter, sans-serif" font-size="11" fill="#166534" font-weight="700">🧠 Semantic Diagnostic Matrix</text>
</svg>
