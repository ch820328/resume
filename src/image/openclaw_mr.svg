<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,1);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0.6);stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1"/>
        </marker>
    </defs>

    <!-- Canvas -->
    <rect width="600" height="400" fill="none"/>

    <!-- Source -->
    <rect x="30" y="160" width="90" height="80" fill="url(#glassGrad)" stroke="#f87171" stroke-width="1" rx="12"/>
    <text x="42" y="195" font-family="Inter, sans-serif" font-size="10" fill="#991b1b" font-weight="700">GitLab MR</text>
    <text x="42" y="212" font-family="Inter, sans-serif" font-size="9" fill="#ef4444">Raw Diff</text>

    <!-- Flow 1 -->
    <path d="M 120 200 L 170 200" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Orchestration Layer -->
    <rect x="180" y="80" width="130" height="240" fill="rgba(255,255,255,0.4)" stroke="#3b82f6" stroke-width="1" rx="16"/>
    <text x="195" y="105" font-family="Inter, sans-serif" font-size="10" fill="#1e40af" font-weight="700">ORCHESTRATOR</text>
    
    <rect x="195" y="130" width="100" height="40" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="205" y="155" font-family="Inter, sans-serif" font-size="9" fill="#334155" font-weight="600">Complexity Analysis</text>
    
    <rect x="195" y="180" width="100" height="40" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="205" y="205" font-family="Inter, sans-serif" font-size="9" fill="#334155" font-weight="600">Plan Generation</text>

    <!-- Parallel Matrix Arrows -->
    <path d="M 310 160 L 340 100 L 360 100" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 310 200 L 360 200" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 310 240 L 340 300 L 360 300" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Specialists -->
    <rect x="370" y="70" width="100" height="60" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="382" y="95" font-family="Inter, sans-serif" font-size="9" fill="#475569" font-weight="700">Security Exp</text>
    <text x="382" y="110" font-family="Inter, sans-serif" font-size="8" fill="#64748b">Vuln Scan</text>

    <rect x="370" y="170" width="100" height="60" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="382" y="195" font-family="Inter, sans-serif" font-size="9" fill="#475569" font-weight="700">Logic Exp</text>
    <text x="382" y="210" font-family="Inter, sans-serif" font-size="8" fill="#64748b">State Logic</text>

    <rect x="370" y="270" width="100" height="60" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="382" y="295" font-family="Inter, sans-serif" font-size="9" fill="#475569" font-weight="700">Arch Exp</text>
    <text x="382" y="310" font-family="Inter, sans-serif" font-size="8" fill="#64748b">Consistency</text>

    <!-- Synthesis -->
    <path d="M 470 100 L 510 180" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 470 200 L 510 200" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 470 300 L 510 220" fill="none" stroke="#cbd5e1" stroke-width="1"/>

    <rect x="520" y="170" width="60" height="60" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1" rx="10"/>
    <text x="525" y="200" font-family="Inter, sans-serif" font-size="9" fill="#5b21b6" font-weight="700">Aggregator</text>
</svg>
