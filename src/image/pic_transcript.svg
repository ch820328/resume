<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,1);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0.6);stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1"/>
        </marker>
    </defs>

    <!-- Stage 1 -->
    <rect x="30" y="160" width="100" height="80" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="12"/>
    <text x="45" y="195" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">OOB Image</text>
    <text x="45" y="210" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8">Raw BIOS UI</text>

    <!-- Flow -->
    <path d="M 130 200 L 180 200" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- CV Logic -->
    <rect x="190" y="80" width="160" height="240" fill="rgba(255,255,255,0.4)" stroke="#0ea5e9" stroke-width="1" rx="16"/>
    <text x="205" y="105" font-family="Inter, sans-serif" font-size="10" fill="#0369a1" font-weight="700">CV ORCHESTRATOR</text>
    
    <rect x="205" y="130" width="130" height="40" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="215" y="155" font-family="Inter, sans-serif" font-size="9" fill="#334155" font-weight="600">Anchor Detection</text>
    
    <rect x="205" y="190" width="130" height="40" fill="url(#glassGrad)" stroke="#0ea5e9" stroke-width="1" rx="8"/>
    <text x="215" y="215" font-family="Inter, sans-serif" font-size="9" fill="#0369a1" font-weight="600">Dynamic ROI Adapt</text>

    <rect x="205" y="250" width="130" height="40" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="215" y="275" font-family="Inter, sans-serif" font-size="9" fill="#334155" font-weight="600">Normalization</text>

    <!-- Flow -->
    <path d="M 350 200 L 400 200" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Transcription -->
    <rect x="410" y="140" width="130" height="120" fill="url(#glassGrad)" stroke="#10b981" stroke-width="1" rx="14" style="filter: drop-shadow(0 4px 12px rgba(16,185,129,0.1))"/>
    <text x="425" y="170" font-family="Inter, sans-serif" font-size="10" fill="#065f46" font-weight="700">TRANSCRIPTION</text>
    <text x="425" y="195" font-family="Inter, sans-serif" font-size="9" fill="#059669">Tesseract Engine</text>
    <text x="425" y="215" font-family="Inter, sans-serif" font-size="9" fill="#059669">Fuzzy Matching</text>

    <!-- Fidelity Badge -->
    <text x="430" y="320" font-family="Inter, sans-serif" font-size="11" fill="#166534" font-weight="700">🎯 99.9% Fidelity</text>
</svg>
