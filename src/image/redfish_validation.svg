<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,1);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0.6);stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1"/>
        </marker>
    </defs>

    <!-- Inputs -->
    <rect x="40" y="80" width="100" height="60" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="50" y="110" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">Redfish API</text>
    <text x="50" y="125" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8">OOB Metadata</text>

    <rect x="40" y="170" width="100" height="60" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="50" y="200" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">SMBIOS / IPMI</text>
    <text x="50" y="215" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8">In-Band Data</text>

    <!-- Flow Arrows -->
    <path d="M 140 110 L 200 160" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>
    <path d="M 140 200 L 200 180" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Consistency Engine -->
    <rect x="210" y="120" width="180" height="120" fill="rgba(255,255,255,0.4)" stroke="#2563eb" stroke-width="1" rx="20" style="filter: drop-shadow(0 8px 24px rgba(37,99,235,0.08))"/>
    <text x="230" y="150" font-family="Inter, sans-serif" font-size="11" fill="#1e40af" font-weight="700">CONSISTENCY ENGINE</text>
    
    <rect x="225" y="175" width="150" height="40" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="8"/>
    <text x="240" y="200" font-family="Inter, sans-serif" font-size="10" fill="#334155" font-weight="600">Cross-Interface Sync</text>

    <!-- Flow -->
    <path d="M 390 180 L 450 180" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Reports -->
    <rect x="460" y="140" width="110" height="80" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="12"/>
    <text x="475" y="175" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">Validation</text>
    <text x="475" y="195" font-family="Inter, sans-serif" font-size="9" fill="#2563eb">Schema Check</text>

    <!-- Impact -->
    <text x="350" y="320" font-family="Inter, sans-serif" font-size="11" fill="#166534" font-weight="700">🎯 Zero-Discrepancy Assurance</text>
</svg>
