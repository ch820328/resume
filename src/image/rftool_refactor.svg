<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,1);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0.6);stop-opacity:1" />
        </linearGradient>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
            <path d="M0,0 L8,4 L0,8" fill="none" stroke="#94a3b8" stroke-width="1"/>
        </marker>
    </defs>

    <!-- Legacy -->
    <rect x="30" y="160" width="100" height="80" fill="#fef2f2" stroke="#ef4444" stroke-width="1" rx="12" stroke-dasharray="2,2"/>
    <text x="42" y="195" font-family="Inter, sans-serif" font-size="10" fill="#991b1b" font-weight="700">Legacy</text>
    <text x="42" y="212" font-family="Inter, sans-serif" font-size="9" fill="#b91c1c">Monolith</text>

    <!-- Flow -->
    <path d="M 130 200 L 180 200" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Modular Framework -->
    <rect x="190" y="80" width="380" height="240" fill="rgba(255,255,255,0.4)" stroke="#2563eb" stroke-width="1" rx="20" style="filter: drop-shadow(0 8px 24px rgba(37,99,235,0.08))"/>
    <text x="210" y="105" font-family="Inter, sans-serif" font-size="11" fill="#1e40af" font-weight="700">RFTOOL MODULAR FRAMEWORK</text>

    <!-- Core Library -->
    <rect x="310" y="130" width="140" height="130" fill="url(#glassGrad)" stroke="#2563eb" stroke-width="1" rx="12"/>
    <text x="325" y="160" font-family="Inter, sans-serif" font-size="10" fill="#1e40af" font-weight="700">CORE LIBRARY</text>
    <text x="325" y="185" font-family="Inter, sans-serif" font-size="9" fill="#334155">• 30+ Shared Funcs</text>
    <text x="325" y="205" font-family="Inter, sans-serif" font-size="9" fill="#334155">• Inheritor Pattern</text>
    <text x="325" y="225" font-family="Inter, sans-serif" font-size="9" fill="#334155">• Protocol Drivers</text>

    <!-- Robot Integration -->
    <rect x="210" y="155" width="80" height="80" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="222" y="195" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">Robot</text>
    <text x="222" y="210" font-family="Inter, sans-serif" font-size="9" fill="#64748b">Engine</text>
    <path d="M 290 200 L 310 200" fill="none" stroke="#2563eb" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Reports -->
    <rect x="470" y="155" width="80" height="80" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="10"/>
    <text x="482" y="195" font-family="Inter, sans-serif" font-size="10" fill="#475569" font-weight="700">JSON</text>
    <text x="482" y="210" font-family="Inter, sans-serif" font-size="9" fill="#64748b">Diagnostics</text>
    <path d="M 450 200 L 470 200" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Speedup -->
    <text x="350" y="300" font-family="Inter, sans-serif" font-size="11" fill="#166534" font-weight="700">⚡ -50% Development Time</text>
</svg>
