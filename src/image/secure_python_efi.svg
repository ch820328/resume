<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Clean Background Gradient -->
    <defs>
        <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:rgba(255,255,255,0.8);stop-opacity:1" />
            <stop offset="100%" style="stop-color:rgba(255,255,255,0.4);stop-opacity:1" />
        </linearGradient>
        <marker id="dot" markerWidth="6" markerHeight="6" refX="3" refY="3">
            <circle cx="3" cy="3" r="2" fill="#cbd5e1" />
        </marker>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M0,0 L10,5 L0,10" fill="none" stroke="#94a3b8" stroke-width="1"/>
        </marker>
    </defs>

    <!-- Canvas -->
    <rect width="600" height="400" fill="none"/>

    <!-- TEE Boundary -->
    <rect x="180" y="60" width="380" height="280" fill="rgba(241, 245, 249, 0.3)" stroke="#e2e8f0" stroke-width="1" rx="20" stroke-dasharray="4,4"/>
    <text x="200" y="85" font-family="Inter, sans-serif" font-size="10" fill="#94a3b8" font-weight="600" letter-spacing="0.05em">UEFI TRUSTED EXECUTION ENVIRONMENT</text>

    <!-- Step 1: Encrypted Asset -->
    <rect x="40" y="160" width="100" height="80" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="12"/>
    <text x="55" y="195" font-family="Inter, sans-serif" font-size="11" fill="#475569" font-weight="700">Encrypted</text>
    <text x="55" y="212" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Python Script</text>

    <!-- Flow Line 1 -->
    <path d="M 140 200 L 210 200" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Step 2: Decryption Core -->
    <rect x="220" y="150" width="140" height="100" fill="url(#glassGrad)" stroke="#2563eb" stroke-width="1" rx="12" style="filter: drop-shadow(0 4px 12px rgba(37,99,235,0.1))"/>
    <text x="235" y="185" font-family="Inter, sans-serif" font-size="11" fill="#1e40af" font-weight="700">RSA-AES Engine</text>
    <text x="235" y="205" font-family="Inter, sans-serif" font-size="10" fill="#2563eb" font-weight="500">In-Memory Logic</text>
    <circle cx="290" cy="225" r="3" fill="#2563eb"/>
    <circle cx="300" cy="225" r="3" fill="#cbd5e1"/>
    <circle cx="310" cy="225" r="3" fill="#cbd5e1"/>

    <!-- Flow Line 2 -->
    <path d="M 360 200 L 420 200" fill="none" stroke="#cbd5e1" stroke-width="1" marker-end="url(#arrow)"/>

    <!-- Step 3: Interpreter -->
    <rect x="430" y="160" width="110" height="80" fill="url(#glassGrad)" stroke="rgba(0,0,0,0.05)" stroke-width="1" rx="12"/>
    <text x="445" y="195" font-family="Inter, sans-serif" font-size="11" fill="#475569" font-weight="700">Interpreter</text>
    <text x="445" y="212" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Direct Execution</text>

    <!-- Security Badge -->
    <rect x="300" y="280" width="120" height="30" fill="#f0fdf4" stroke="#86efac" stroke-width="1" rx="15"/>
    <text x="315" y="300" font-family="Inter, sans-serif" font-size="10" fill="#166534" font-weight="600">🛡️ Verified Integrity</text>
</svg>
